name: Swift

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build and test
        run: >-
          xcodebuild test
          -project macos/Souvenirs.xcodeproj
          -scheme Souvenirs
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/SouvenirsDerivedData"
          CODE_SIGN_IDENTITY=-
          DEVELOPMENT_TEAM=

      - name: Build and verify Release app
        run: |
          xcodebuild build \
            -project macos/Souvenirs.xcodeproj \
            -scheme Souvenirs \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SouvenirsReleaseDerivedData" \
            OTHER_CODE_SIGN_FLAGS=--timestamp=none
          app="$RUNNER_TEMP/SouvenirsReleaseDerivedData/Build/Products/Release/Souvenirs.app"
          ./scripts/verify-release.sh --allow-adhoc "$app"

      - name: Validate representative attached storage
        run: ./scripts/validate-representative-storage.sh
