name: Swift

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build and test Swift state
        run: just test-swift
        env:
          SWIFT_DERIVED_DATA_PATH: ${{ runner.temp }}/SouvenirsStateDerivedData

      - name: Verify Debug engine overrides
        run: |
          app="$RUNNER_TEMP/SouvenirsStateDerivedData/Build/Products/Debug/Souvenirs.app"
          [[ -d "$app" ]] || {
            echo "Debug app not found: $app" >&2
            exit 1
          }
          for override in SOUVENIRS_ENGINE_EXECUTABLE SOUVENIRS_FAKE_ENGINE_SCENARIO; do
            grep -aFrq -- "$override" "$app/Contents/MacOS" || {
              echo "Debug app does not contain development engine override: $override" >&2
              exit 1
            }
          done

      - name: Run Swift UI tests
        run: just test-ui
        env:
          SWIFT_DERIVED_DATA_PATH: ${{ runner.temp }}/SouvenirsUIDerivedData

      - name: Build and verify Release app
        run: |
          xcodebuild build \
            -project macos/Souvenirs.xcodeproj \
            -scheme Souvenirs \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SouvenirsReleaseDerivedData" \
            OTHER_CODE_SIGN_FLAGS=--timestamp=none
          app="$RUNNER_TEMP/SouvenirsReleaseDerivedData/Build/Products/Release/Souvenirs.app"
          ./scripts/verify-release.sh --allow-adhoc "$app"

      - name: Validate representative attached storage
        run: ./scripts/validate-representative-storage.sh
