name: Performance

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    name: Import scan and plan
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Measure import performance
        run: |
          just measure-import-performance > import-performance.jsonl
          cat import-performance.jsonl

      - name: Retain measurement
        uses: actions/upload-artifact@v4
        with:
          name: import-performance-${{ github.run_id }}
          path: import-performance.jsonl
          retention-days: 90
