[workspace]
members = [
    "crates/souvenirs-application",
    "crates/souvenirs-cli",
    "crates/souvenirs-domain",
    "crates/souvenirs-engine",
    "crates/souvenirs-metadata",
    "crates/souvenirs-protocol",
    "crates/souvenirs-storage",
    "crates/souvenirs-test-support",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
repository = "https://github.com/yoannchaudet/souvenirs-v2"

[workspace.dependencies]
# These versions define durable Unicode collision behavior and Rust 1.81 compatibility.
caseless = "=0.2.2"
proptest = "=1.8.0"
jsonschema = { version = "=0.17.1", default-features = false }
schemars = "=0.8.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.10.8"
# Pin jsonschema transitives to releases that support the workspace Rust 1.81 MSRV.
tempfile = "=3.12.0"
time = { version = "=0.3.36", default-features = false }
unicode-normalization = "=0.1.25"
url = "=2.4.1"
uuid = "=1.10.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
