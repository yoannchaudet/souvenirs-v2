[package]
name = "souvenirs-cli"
description = "Automation-oriented command-line interface for Souvenirs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "=4.5.20", features = ["derive"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
souvenirs-domain = { path = "../souvenirs-domain" }
souvenirs-metadata = { path = "../souvenirs-metadata" }
souvenirs-storage = { path = "../souvenirs-storage" }
time = { workspace = true, features = ["macros", "parsing"] }

[dev-dependencies]
jsonschema.workspace = true
tempfile.workspace = true

[lints]
workspace = true
